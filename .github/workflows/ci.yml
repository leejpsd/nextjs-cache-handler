name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Coverage in CI is informational; the local pre-publish hook still
      # enforces thresholds. We don't fail CI on coverage drops because the
      # initial release lacks the integration tests that lift branch
      # coverage above 85% — those land in v0.2 with docker services.
      - run: npm run test:unit
      - run: npm run build
      - run: npx publint
      - run: npx attw --pack .

  spec-snapshot:
    name: Verify Next.js 16 spec snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Manual review checkpoint: when this hash diverges, re-read
      # docs/next16-spec.md against the upstream docs and update.
      - name: Print snapshot fingerprint
        run: |
          sha256sum docs/next16-spec.md
