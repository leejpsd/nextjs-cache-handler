name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Coverage in CI is informational; the local pre-publish hook still
      # enforces thresholds. We don't fail CI on coverage drops because the
      # initial release lacks the integration tests that lift branch
      # coverage above 85% — those land in v0.2 with docker services.
      - run: npm run test:unit
      - run: npm run build
      - run: npx publint
      - run: npx attw --pack .

  integration:
    name: Integration tests (real Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Wait for Redis
        run: |
          for i in {1..20}; do
            if redis-cli -h 127.0.0.1 -p 6390 ping >/dev/null 2>&1; then
              echo "Redis is up"
              exit 0
            fi
            sleep 1
          done
          echo "Redis didn't come up in time" >&2
          exit 1
      - name: Run integration tests
        env:
          INTEGRATION_REDIS_URL: redis://127.0.0.1:6390
        run: npm run test:integration

  spec-snapshot:
    name: Verify Next.js 16 spec snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Manual review checkpoint: when this hash diverges, re-read
      # docs/next16-spec.md against the upstream docs and update.
      - name: Print snapshot fingerprint
        run: |
          sha256sum docs/next16-spec.md
