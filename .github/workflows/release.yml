name: Release

# Two trigger modes:
#   workflow_dispatch — manually launch a release run (recommended for
#                       the first GHA-driven publish so we can watch logs)
#   push:branches:main — once stable, every changeset merged into main
#                        publishes automatically (uncomment the block
#                        below to enable)
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  release:
    name: Publish via Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write    # required for npm provenance attestation
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --no-audit --no-fund

      # Verify gates — same set the local pre-publish hook runs.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx publint
      - run: npx attw --pack .

      # Integration tests for the release workflow run against an
      # ephemeral Redis 7 service container — not strictly required for a
      # patch release, but cheap insurance.
      - name: Spin up Redis for release-time integration check
        run: |
          docker run -d --name release-redis -p 6390:6379 redis:7-alpine
          for i in {1..20}; do
            if docker exec release-redis redis-cli ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
      - name: Integration tests
        env:
          INTEGRATION_REDIS_URL: redis://127.0.0.1:6390
        run: npm run test:integration

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          # publish: gets called when there are no changesets left to apply.
          #          Run the build first so dist/ is populated.
          publish: npm run publish:changesets
          # version:  consumes pending changesets and updates package.json,
          #          CHANGELOG, and creates a "Version Packages" PR.
          version: npm run version:changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
